version: '3.8'

services:
  # ============================================================================
  # 1. Base de Datos PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: tlamatqui-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-tlamatqui_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 2. Servidor Backend API REST (Express / Node.js)
  # ============================================================================
  backend:
    image: ghcr.io/cesar-ayar/tlamatqui-backend:latest
    container_name: tlamatqui-backend-api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - SERVE_STATIC=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-tlamatqui_db}?schema=public
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - VERCEL_AUTH_TOKEN=${VERCEL_AUTH_TOKEN:-}
      - VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID:-}
      - VERCEL_TEAM_ID=${VERCEL_TEAM_ID:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - API_SECRET_TOKEN=${API_SECRET_TOKEN:-}
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN:-}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy