version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tlamatqui-postgres
    restart: always
    environment:
      POSTGRES_USER: tlamatqui_user
      POSTGRES_PASSWORD: tlamatqui_password
      POSTGRES_DB: tlamatqui_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlamatqui_user -d tlamatqui_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor REST API Backend Express
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: tlamatqui-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://tlamatqui_user:tlamatqui_password@postgres:5432/tlamatqui_db?sslmode=disable
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # Cliente Web Frontend Nginx SPA
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: tlamatqui-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
