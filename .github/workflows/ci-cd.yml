name: "CI/CD Pipeline: Lint, Build & Release Please"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # 1. ETAPA DE VERIFICACIÓN CI (Lint & Build con Node.js 24)
  # ============================================================================
  ci-build:
    name: 🧪 CI Verification (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar Cliente Prisma
        run: npx prisma generate

      - name: Verificación de Tipos TypeScript (Lint)
        run: npm run lint

      - name: Compilación Completa (Frontend + Backend)
        run: npm run build

  # ============================================================================
  # 2. ETAPA RELEASE-PLEASE: Autogestión de Versión, Changelog y Release
  # ============================================================================
  release-please:
    name: 📦 Release Please & Versionado
    needs: ci-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      - uses: googleapis/release-please-action@d1a8f221d7723166f48a584aebba00ef3f6febec # v4.1.4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
