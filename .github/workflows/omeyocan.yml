name: "CI/CD Pipeline: Omeyocan (Producción & Release Please)"

on:
  push:
    branches:
      - omeyocan
  pull_request:
    branches:
      - omeyocan
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # 1. ETAPA DE VERIFICACIÓN CI PRODUCCIÓN (Lint, Tipos & Compilación)
  # ============================================================================
  omeyocan-verify:
    name: 🛡️ Omeyocan Production CI (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio (Bootstrap para Acción Local)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Entorno Tlamatqui (Node 24 + Prisma)
        uses: ./.github/actions/setup-tlamatqui

      - name: Verificación de Tipos TypeScript (Lint)
        run: npm run lint

      - name: Compilación Completa para Producción (Frontend + Backend)
        run: npm run build

  # ============================================================================
  # 2. ETAPA RELEASE-PLEASE: Autogestión de Versión, Changelog y Release en Omeyocan
  # ============================================================================
  release-please:
    name: 📦 Release Please (Omeyocan)
    needs: omeyocan-verify
    if: github.ref == 'refs/heads/omeyocan' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      - uses: googleapis/release-please-action@d1a8f221d7723166f48a584aebba00ef3f6febec # v4.1.4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: omeyocan
